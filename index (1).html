<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri RV College</title>
<style>
:root{--bg:#eef3f6;--grid:#d5e0e7;--ink:#12263a;--mute:#5b6f80;--card:#fbfdfe;--line:#c3d2dc;--acc:#1f7a8c;--acc2:#b5532a;--brk:#e7edf1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b26;--grid:#192a38;--ink:#e4edf3;--mute:#93a7b6;--card:#15242f;--line:#2b4152;--acc:#4fb3c6;--acc2:#e08a5e;--brk:#1b2e3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b26;--grid:#192a38;--ink:#e4edf3;--mute:#93a7b6;--card:#15242f;--line:#2b4152;--acc:#4fb3c6;--acc2:#e08a5e;--brk:#1b2e3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,"Times New Roman",serif;line-height:1.55;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3,button,input,label,.tab,.time{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:clamp(1.9rem,6vw,2.8rem);margin:0;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mute);margin:6px 0 0}
button{cursor:pointer;font-size:.95rem;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);padding:26px}
.login h2{margin:0 0 4px;font-size:1.4rem}
.login label{display:block;margin:14px 0 4px;font-size:.9rem;color:var(--mute)}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:1rem}
.err{color:var(--acc2);min-height:1.4em;margin:10px 0 0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{flex:1 0 auto;min-width:72px;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:.95rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sum h2{margin:0;font-size:1.3rem}
.sum span{color:var(--mute);font-family:"IBM Plex Sans",system-ui,sans-serif}
.slot{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);padding:12px 14px;margin-bottom:8px}
.slot.brk{background:var(--brk);border-left-color:var(--line);color:var(--mute)}
.time{font-weight:600;font-size:.9rem;white-space:nowrap}
.slot b{display:block;font-size:1.05rem}
.slot small{color:var(--mute)}
.edit{grid-column:1/-1;display:grid;gap:8px}
.edit .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit label{font-size:.9rem;display:flex;gap:6px;align-items:center}
.edit input[type=checkbox]{width:auto}
.hint{color:var(--mute);font-size:.88rem;margin-top:16px}
@media(max-width:520px){.slot{grid-template-columns:1fr auto}.time{grid-column:1/-1}}
.rep{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);padding:14px 16px;margin-bottom:18px}
.rep.hl{border-left-color:var(--acc2)}
.rep h2{margin:0 0 2px;font-size:1.1rem}
.rep .big{margin:0;font-size:1.5rem;font-weight:600;font-family:"IBM Plex Sans",system-ui,sans-serif}
.rep .sub{margin:2px 0 0}
.days{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.days span{flex:1 0 74px;border:1px solid var(--line);padding:6px 8px;font-size:.85rem;text-align:center;font-family:"IBM Plex Sans",system-ui,sans-serif}
.chip{display:inline-block;margin-left:8px;font-size:.78rem;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute);font-family:"IBM Plex Sans",system-ui,sans-serif}
.chip.done{color:var(--acc);border-color:var(--acc)}
.chip.live{color:var(--acc2);border-color:var(--acc2);font-weight:600}
.slot.live{border-left-color:var(--acc2)}
.slot.skip{opacity:.65}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:1rem}
.ntab{flex:1 0 auto;min-width:120px;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:.95rem}
.ntab[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.95rem;font-family:"IBM Plex Sans",system-ui,sans-serif}
.ntab.m{min-width:92px}
.act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var KEY="srirv_schedule_v4", SKIP="srirv_skips_v1", AUTH="srirv_auth";
var SLOTS=[
{time:"8:00 – 9:15 AM",s:480,e:555,m:75,t:"KCET-2",n:"Physics · P-RC"},
{time:"9:15 – 9:45 AM",s:555,e:585,brk:true,t:"Breakfast",n:""},
{time:"9:45 – 11:00 AM",s:585,e:660,m:75,t:"KCET-2",n:"Physics · P-RC"},
{time:"11:00 AM – 12:15 PM",s:660,e:735,m:75,t:"MED-1",n:"Physics · P-RC · Study Hour"},
{time:"12:20 – 1:20 PM",s:740,e:800,m:60,t:"1st SRG-E",n:"Physics · P-RC · Study Hour"},
{time:"1:20 – 2:00 PM",s:800,e:840,brk:true,t:"Lunch break",n:""},
{time:"4:10 – 5:00 PM",s:970,e:1020,brk:true,t:"Snacks",n:""}
];
function defaults(){var d={};DAYS.forEach(function(day){d[day]=SLOTS.map(function(s){return {time:s.time,s:s.s,e:s.e,m:s.m||0,brk:!!s.brk,t:s.t,n:s.n}})});return d}
var data=defaults(), skips={}, editing=null, authed=false;
var TI=(new Date().getDay()+6)%7, tab=TI<6?TI:0;
try{var sv=localStorage.getItem(KEY);if(sv)data=JSON.parse(sv)}catch(e){}
try{skips=JSON.parse(localStorage.getItem(SKIP)||"{}")}catch(e){}
try{authed=sessionStorage.getItem(AUTH)==="1"}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function saveSkips(){try{localStorage.setItem(SKIP,JSON.stringify(skips))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function weekKey(){var n=new Date(),i=(n.getDay()+6)%7,m=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);return m.getFullYear()+"-"+pad(m.getMonth()+1)+"-"+pad(m.getDate())}
var START=new Date(2026,9,29);
function dayDate(di){var n=new Date(),ti=(n.getDay()+6)%7;return new Date(n.getFullYear(),n.getMonth(),n.getDate()-ti+di)}
function sk(di,i){return weekKey()+"|"+di+"|"+i}
function status(di,i,s){
  if(s.brk)return "break";
  if(dayDate(di)<START)return "before";
  if(skips[sk(di,i)])return "skipped";
  var n=new Date(),ti=(n.getDay()+6)%7,m=n.getHours()*60+n.getMinutes();
  if(di<ti)return "done"; if(di>ti)return "upcoming";
  return m>=s.e?"done":(m>=s.s?"live":"upcoming");
}
function weekStats(){
  var r={per:[],done:0,total:0,mins:0,skip:0};
  DAYS.forEach(function(d,di){var c=0,t=0;
    data[d].forEach(function(s,i){if(s.brk)return;var st=status(di,i,s);if(st==="before")return;t++;
      if(st==="done"){c++;r.mins+=s.m||0}if(st==="skipped")r.skip++});
    r.done+=c;r.total+=t;r.per.push({d:d,c:c,t:t})});
  return r;
}
function monthStats(){
  var n=new Date(),y=n.getFullYear(),mo=n.getMonth(),r={done:0,mins:0,total:0},nm=n.getHours()*60+n.getMinutes();
  var last=new Date(y,mo+1,0).getDate(),td=new Date(y,mo,n.getDate());
  for(var d=1;d<=last;d++){
    var dt=new Date(y,mo,d),dow=(dt.getDay()+6)%7;if(dow===6)continue;if(dt<START)continue;
    var ws=new Date(y,mo,d-dow),wk=ws.getFullYear()+"-"+pad(ws.getMonth()+1)+"-"+pad(ws.getDate());
    data[DAYS[dow]].forEach(function(s,i){
      if(s.brk)return;r.total++;
      if(skips[wk+"|"+dow+"|"+i])return;
      if(dt<td||(d===n.getDate()&&nm>=s.e)){r.done++;r.mins+=s.m||0}
    });
  }
  return r;
}
var LABEL={before:"Before start",done:"Completed",live:"In progress",upcoming:"Upcoming",skipped:"Not held"};

function loginView(msg){
  document.getElementById("app").innerHTML=
  '<h1 style="text-align:center">Sri RV College</h1><p class="sub" style="text-align:center">Physics teaching schedule</p>'+
  '<div class="login"><h2>Admin sign in</h2><p class="sub">Enter your details to open the timetable.</p>'+
  '<label for="u">Username</label><input id="u" autocomplete="username">'+
  '<label for="p">Password</label><input id="p" type="password" autocomplete="current-password">'+
  '<p class="err" id="err" role="alert">'+(msg||"")+'</p>'+
  '<button class="pri" id="go" style="width:100%">Sign in</button></div>';
  var go=function(){
    var u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;
    if(u==="admin"&&p==="password"){authed=true;try{sessionStorage.setItem(AUTH,"1")}catch(e){}mainView()}
    else loginView("Wrong username or password. Try again.");
  };
  document.getElementById("go").onclick=go;
  document.getElementById("p").onkeydown=function(e){if(e.key==="Enter")go()};
}

function mainView(){
  TI=(new Date().getDay()+6)%7;
  var day=DAYS[tab], slots=data[day], w=weekStats(), ms=monthStats(), mn=new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  var today=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var h='<header><div><h1>Sri RV College</h1><p class="sub">'+today+(TI===6?' · Sunday, no classes':'')+'</p></div><button id="out">Sign out</button></header>'+navHtml();
  h+='<section class="rep'+(TI>=5?' hl':'')+'"><h2>'+(TI===5?'Saturday report':TI===6?'Week report':'This week')+'</h2>'+
     '<p class="big">'+w.done+' of '+w.total+' classes completed</p>'+
     '<p class="sub">'+Math.floor(w.mins/60)+' h '+w.mins%60+' min taught'+(w.skip?' · '+w.skip+' not held':'')+'</p>'+
     '<p class="sub"><b>'+mn+':</b> '+ms.done+' of '+ms.total+' classes completed · '+Math.floor(ms.mins/60)+' h '+ms.mins%60+' min taught</p>'+
     '<div class="days">'+w.per.map(function(p){return '<span><b>'+p.d.slice(0,3)+'</b> '+(p.t?p.c+'/'+p.t:'–')+'</span>'}).join("")+'</div></section>';
  h+='<div class="tabs" role="tablist">'+DAYS.map(function(d,i){return '<button class="tab" role="tab" aria-selected="'+(i===tab)+'" data-i="'+i+'">'+d.slice(0,3)+(i===TI?' (today)':'')+'</button>'}).join("")+'</div>';
  h+='<div class="sum"><h2>'+day+'</h2><span>4 P-RC classes · 4 h 45 min</span></div>';
  var pt=PM[iso(dayDate(tab))],ty=ptype(pt);
  h+='<section class="rep'+(ty==="class"?' hl':'')+'"><h2>Topic for '+day+'</h2><p class="sub"><span class="chip '+(ty==="class"?'done':'')+'" style="margin:0 6px 0 0">'+PL[ty]+'</span>'+esc(pt||"Nothing planned yet")+'</p></section>';
  slots.forEach(function(s,i){
    var st=status(tab,i,s);
    h+='<div class="slot'+(s.brk?' brk':'')+(st==='live'?' live':'')+(st==='skipped'?' skip':'')+'"><div class="time">'+esc(s.time)+'</div>';
    h+='<div><b>'+esc(s.t||"Free")+'</b>'+(s.n?'<small>'+esc(s.n)+'</small>':'')+(s.brk?'':'<span class="chip '+st+'">'+LABEL[st]+'</span>')+'</div>';
    h+='<div class="act">'+(s.brk||st==="before"?'':'<button data-k="'+i+'">'+(st==="skipped"?'Mark held':'Not held')+'</button>')+'<button data-e="'+i+'">'+(editing===i?'Close':'Edit')+'</button></div>';
    if(editing===i){
      h+='<div class="edit"><input id="et" value="'+esc(s.t)+'" aria-label="Class title"><input id="en" value="'+esc(s.n)+'" aria-label="Topic or note">'+
      '<div class="row"><label><input type="checkbox" id="eb"'+(s.brk?' checked':'')+'> This is a break</label>'+
      '<button class="pri" data-s="'+i+'">Save changes</button></div></div>';
    }
    h+='</div>';
  });
  h+='<p class="hint">The timetable starts on 29 October 2026. Classes are marked completed automatically as their time passes, and the weekly count resets every Monday. Use "Not held" if a class did not take place. Data is saved in this browser only.</p>';
  document.getElementById("app").innerHTML=h;bindNav();
  document.getElementById("out").onclick=function(){authed=false;try{sessionStorage.removeItem(AUTH)}catch(e){}loginView()};
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab=+b.dataset.i;editing=null;mainView()}});
  document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){var i=+b.dataset.e;editing=editing===i?null:i;mainView()}});
  document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){var k=sk(tab,+b.dataset.k);if(skips[k])delete skips[k];else skips[k]=true;saveSkips();mainView()}});
  document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.s,o=data[day][i];
    data[day][i]={time:o.time,s:o.s,e:o.e,m:o.m,t:document.getElementById("et").value.trim(),n:document.getElementById("en").value.trim(),brk:document.getElementById("eb").checked};
    save();editing=null;mainView();
  }});
}
var view="tt", A=null, DB=null, items=[], amsg="", abatch="All";
function navHtml(){return '<div class="tabs"><button class="ntab" data-v="tt" aria-selected="'+(view==="tt")+'">Timetable</button><button class="ntab" data-v="as" aria-selected="'+(view==="as")+'">Assignments</button><button class="ntab" data-v="pl" aria-selected="'+(view==="pl")+'">Planner</button></div>'}
function bindNav(){document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){view=b.dataset.v;amsg="";if(view==="as")assignView();else if(view==="pl")planView();else mainView()}})}
function fsize(n){return n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB"}
var lloaded=false;
function lopen(){return new Promise(function(res,rej){var q=indexedDB.open("srirv_pdfs",1);q.onupgradeneeded=function(){q.result.createObjectStore("pdfs",{keyPath:"id"})};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
function lreq(mode,fn){return lopen().then(function(d){return new Promise(function(res,rej){var tx=d.transaction("pdfs",mode),r=fn(tx.objectStore("pdfs"));tx.oncomplete=function(){res(r&&r.result)};tx.onerror=function(){rej(tx.error)}})})}
function lsave(rec){return lreq("readwrite",function(s){return s.put(rec)})}
function ldel(id){return lreq("readwrite",function(s){return s.delete(id)})}
function lget(id){return lreq("readonly",function(s){return s.get(id)})}
function lall(){return lreq("readonly",function(s){return s.getAll()}).then(function(r){return (r||[]).sort(function(a,b){return (b.at||0)-(a.at||0)})})}
function assignView(){
  var local=!(A&&DB);
  if(local&&!lloaded){lloaded=true;lall().then(function(r){items=r;assignView()}).catch(function(){})}
  var h='<header><div><h1>Sri RV College</h1><p class="sub">Assignments</p></div><button id="out">Sign out</button></header>'+navHtml();
  if(local)h+='<p class="hint">PDFs you add here are saved on this device and browser only. They will not appear on other devices.</p>';
  {
    h+='<section class="rep"><h2>Upload assignment (PDF)</h2><div class="edit"><input id="at" placeholder="Assignment title" aria-label="Assignment title"><select id="ab" aria-label="Batch"><option>KCET-2</option><option>MED-1</option><option>1st SRG-E</option></select><label for="ad">Due date</label><input id="ad" type="date"><input id="af" type="file" accept="application/pdf,.pdf" aria-label="PDF file"><div class="row"><button class="pri" id="aup">Upload PDF</button></div><p class="err" id="am" role="status">'+esc(amsg)+'</p></div></section>';
    var list=items.filter(function(x){return abatch==="All"||x.batch===abatch});
    h+='<div class="tabs">'+["All","KCET-2","MED-1","1st SRG-E"].map(function(b){return '<button class="ntab" data-b="'+b+'" aria-selected="'+(abatch===b)+'">'+b+'</button>'}).join("")+'</div>';
    h+='<div class="sum"><h2>'+(abatch==="All"?"All batches":abatch)+'</h2><span>'+list.length+' PDF'+(list.length===1?'':'s')+'</span></div>';
    if(!list.length)h+='<p class="hint">No assignments here yet. Add a title, choose a PDF and press Upload PDF.</p>';
    list.forEach(function(x){
      h+='<div class="slot"><div class="time">'+new Date(x.at||Date.now()).toLocaleDateString("en-IN",{day:"numeric",month:"short"})+'</div><div><b>'+esc(x.title||"Untitled")+'</b><small>'+esc(x.batch||"")+' · '+fsize(x.size||0)+(x.due?' · Due '+new Date(x.due+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):'')+'</small></div><div class="act">'+(local?'<button data-o="'+esc(x.id)+'">Open</button>':'<a class="btn" target="_blank" rel="noopener" href="/_blob/'+esc(x.assetId)+'">Open</a>')+'<button data-d="'+esc(x.id)+'">Delete</button></div></div>';
    });
  }
  document.getElementById("app").innerHTML=h;bindNav();
  document.getElementById("out").onclick=function(){authed=false;try{sessionStorage.removeItem(AUTH)}catch(e){}loginView()};
  document.querySelectorAll("[data-b]").forEach(function(b){b.onclick=function(){abatch=b.dataset.b;assignView()}});
  var up=document.getElementById("aup");
  if(up)up.onclick=function(){
    var t=document.getElementById("at").value.trim(),f=document.getElementById("af").files[0],m=document.getElementById("am");
    if(!t||!f){m.textContent="Add a title and choose a PDF file.";return}
    if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){m.textContent="Only PDF files can be uploaded.";return}
    up.disabled=true;m.textContent="Uploading…";
    (local?lsave({id:Date.now().toString(36),title:t,batch:document.getElementById("ab").value,due:document.getElementById("ad").value,size:f.size,at:Date.now(),blob:f}).then(function(){return lall()}).then(function(r){items=r}):A.upload(f).then(function(r){
      var id=Date.now().toString(36);
      return DB.collection("assignments").doc(id).set({title:t,batch:document.getElementById("ab").value,due:document.getElementById("ad").value,assetId:r.id,size:r.sizeBytes||f.size,at:Date.now()});
    })).then(function(){amsg="Uploaded.";assignView()}).catch(function(e){up.disabled=false;m.textContent="Upload failed ("+((e&&e.code)||"error")+"). Try again."});
  };
  document.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){lget(b.dataset.o).then(function(x){if(x&&x.blob)window.open(URL.createObjectURL(x.blob),"_blank")})}});
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){
    var x=items.filter(function(i){return i.id===b.dataset.d})[0];if(!x)return;b.disabled=true;
    (local?ldel(x.id).then(function(){return lall()}).then(function(r){items=r;assignView()}):A.delete(x.assetId).catch(function(){}).then(function(){return DB.collection("assignments").doc(x.id).delete()})).then(function(){amsg="Deleted."}).catch(function(){amsg="Could not delete. Try again.";assignView()});
  }});
}
